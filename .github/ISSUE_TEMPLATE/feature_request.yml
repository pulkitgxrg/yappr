name: Feature request
description: Suggest an improvement for Yappr.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please describe the problem you want to solve and what success looks like.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or implementation notes if helpful.